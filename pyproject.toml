[project]
name = "mojo-statsforecast"
version = "0.1.0"
description = "ETS, ARIMA, and Theta forecasting kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "statsforecast==2.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
